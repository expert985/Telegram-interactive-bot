version: '3.8'

services:
  # ==================== 后端 API 服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telegram_customer_backend
    ports:
      - "8000:8000"  # 映射到主机 8000 端口
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=telegram
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-telegram123}
      - MYSQL_DATABASE=telegram_customer
      - REDIS_URL=redis://redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-me}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - telegram_network

  # ==================== 前端 Web 服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telegram_customer_frontend
    ports:
      - "3000:80"  # 映射到主机 3000 端口
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - telegram_network

  # ==================== MySQL 8.0.36 数据库 ====================
  mysql:
    image: mysql:8.0.36
    container_name: telegram_customer_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=telegram_customer
      - MYSQL_USER=telegram
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-telegram123}
      - TZ=Asia/Shanghai
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-authentication-plugin=mysql_native_password',
      '--max_connections=500',
      '--innodb_buffer_pool_size=256M'
    ]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql  # 自动初始化
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "telegram", "-ptelegram123"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - telegram_network

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: telegram_customer_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - telegram_network

  # ==================== Nginx 反向代理（可选）====================
  nginx:
    image: nginx:alpine
    container_name: telegram_customer_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL 证书目录
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - telegram_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  telegram_network:
    driver: bridge
