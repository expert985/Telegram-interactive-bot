version: '3.8'

services:
  # ==================== 后端 API 服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telegram_customer_backend
    ports:
      - "8000:8000"  # 映射到主机 8000 端口
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-me}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - telegram_network

  # ==================== 前端 Web 服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telegram_customer_frontend
    ports:
      - "3000:80"  # 映射到主机 3000 端口
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - telegram_network

  # ==================== MongoDB 数据库 ====================
  mongo:
    image: mongo:7.0
    container_name: telegram_customer_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    restart: unless-stopped
    networks:
      - telegram_network

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: telegram_customer_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - telegram_network

  # ==================== Nginx 反向代理（可选）====================
  nginx:
    image: nginx:alpine
    container_name: telegram_customer_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL 证书目录
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - telegram_network

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local

networks:
  telegram_network:
    driver: bridge
